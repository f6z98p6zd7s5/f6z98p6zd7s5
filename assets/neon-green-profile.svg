<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Neon Green project profile</title>
  <desc id="desc">Dark technical grid with neon green arcs and the words Build, Verify, Improve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040806"/>
      <stop offset="0.55" stop-color="#07160e"/>
      <stop offset="1" stop-color="#020403"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8cff00"/>
      <stop offset="0.55" stop-color="#00ff88"/>
      <stop offset="1" stop-color="#00d9ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#35ff86" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="1010" cy="180" r="112" fill="none" stroke="url(#neon)" stroke-width="3" opacity="0.85" filter="url(#glow)"/>
  <circle cx="1010" cy="180" r="72" fill="none" stroke="#8cff00" stroke-width="1.5" opacity="0.45"/>
  <path d="M920 180h180M1010 90v180" stroke="#00ff88" stroke-opacity="0.3"/>
  <text x="78" y="105" fill="#90ff27" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="5">NEON GREEN SYSTEMS</text>
  <text x="74" y="190" fill="#f3fff7" font-family="Arial, sans-serif" font-size="64" font-weight="800">Build. Verify. Improve.</text>
  <text x="78" y="250" fill="#9fb5a6" font-family="Arial, sans-serif" font-size="25">Practical AI autonomy with human control.</text>
  <rect x="78" y="286" width="560" height="4" rx="2" fill="url(#neon)" filter="url(#glow)"/>
</svg>
